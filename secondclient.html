<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='24' height='24' fill='none' stroke='%232ecf8e' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E %3Crect x='2' y='3' width='20' height='14' rx='2'/%3E %3Cpath d='M12 17v3M8 20h8'/%3E %3Cpath d='M4 4l7.07 17 2.51-7.39L21 11.06z' fill='%232ecf8e' stroke='none' transform='translate(6.8 3.8) scale(0.5)'/%3E %3C/svg%3E" />
<title>Desktop Stream — 視聴</title>
<style>
  /* 配信の視聴専用クライアント。
     URLの ?room=<ベース32文字><部屋数+1の3桁> から部屋数を割り出し、
     001から順に空き部屋を探して入室する。

     【画面の作り】ツイキャスの視聴画面を目標にした「全画面 + オーバーレイ」。
     映像を画面いっぱいに敷き、その上にヘッダ・コメント・操作を重ねる。
     以前は「ヘッダ / 映像(16:9) / コメント欄」を縦に積んでいたため、
     映像が小さく、コメント欄が別の箱に見えていた。
     【映像は contain のまま】cover にすると横長のPC画面の左右が切れ、
     何が映っているか分からなくなる。見た目より「全部見える」を優先する。 */
  :root {
    --fg: #f2f5f8;
    --fg2: rgba(233,238,243,.72);
    --line: rgba(255,255,255,.13);
    --panel: rgba(14,18,23,.86);
    --accent: #2ecf8e;
    --warn: #ffc46b;
    --pill: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    position: fixed; inset: 0; overflow: hidden;
    background: #000; color: var(--fg);
    /* この画面に出るのは視聴者が書いたコメントと名前、つまり普通の文章である。
       操作クライアント2種の等幅指定はログ・IPアドレス・鍵指紋を読むためのもので、
       ここには当てはまらない。あえて揃えず、読みやすいシステムフォントを使う。 */
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 上端の帯(映像の上に薄く重ねる) ---------- */
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 20px calc(14px + env(safe-area-inset-left));
    background: linear-gradient(to bottom, rgba(0,0,0,.62), rgba(0,0,0,.24) 60%, rgba(0,0,0,0));
    pointer-events: none;
  }
  header h1 {
    font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #e8edf2;
    text-shadow: 0 1px 3px rgba(0,0,0,.75);
  }
  /* 版の表示。狭い画面では真っ先に消してよい情報なので、詰まったら隠す。 */
  #verClient { font-size: 11px; color: rgba(233,238,243,.55); flex: none; text-shadow: 0 1px 3px rgba(0,0,0,.75); }
  @media (max-width: 420px) { #verClient { display: none; } }
  #dot {
    width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none;
    box-shadow: 0 0 0 3px rgba(0,0,0,.25);
  }
  #dot.ok { background: var(--accent); } #dot.warn { background: #e8b93c; } #dot.err { background: #e05252; }
  #status {
    margin-left: auto; font-size: 11px; color: var(--fg2); text-align: right;
    text-shadow: 0 1px 3px rgba(0,0,0,.75);
    max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---------- 映像(画面いっぱい) ---------- */
  #app { position: absolute; inset: 0; }
  .stage { position: absolute; inset: 0; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  /* 状態を示す小さな札(トグル表示)。操作クライアント2種と同じ作り。
     色だけに頼らず ON / OFF の文字を必ず入れる。 */
  .sw {
    display: inline-block; margin-left: 4px; padding: 0 5px;
    border-radius: 999px; font-size: 10px; font-weight: 700;
    line-height: 15px; vertical-align: 1px;
    background: #48484a; color: #f5f5f7;
  }
  .sw.on { background: #30d158; color: #06240f; }

  #ovMsg {
    position: absolute; left: 0; right: 0; top: 42%; text-align: center;
    color: rgba(233,238,243,.72); font-size: 13px; padding: 0 24px; pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  #soundOnly {
    position: absolute; inset: 0; display: none;
    font-size: 20px; font-weight: 700; letter-spacing: .1em; color: #cfd6dd;
    background: #0d1116; pointer-events: none;
    align-items: center; justify-content: center;
  }
  /* JSで display を "" にすると下記のflexが効く */
  #soundOnly:not([style*="none"]) { display: flex; }
  #retry {
    position: absolute; left: 50%; top: 58%; transform: translate(-50%,-50%);
    padding: 10px 18px; font: inherit; font-size: 13px; color: var(--fg);
    background: rgba(28,58,46,.92); border: 1px solid #2f5a46; border-radius: var(--pill);
    cursor: pointer; touch-action: manipulation; display: none; z-index: 8;
  }
  #retry.on { display: block; }
  /* 配信タイトル: 上端の帯のすぐ下に重ねる(下端はコメントと入力欄が使うため) */
  #bTitle {
    position: absolute; left: 0; right: 0; z-index: 6;
    top: calc(44px + env(safe-area-inset-top));
    padding: 0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
    font-size: 13px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
  }
  #bTitle:empty { display: none; }
  .stage.hide-title #bTitle { display: none; }
  /* 全画面から戻るボタン: 全画面中のみ表示 */
  #fsExit {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    z-index: 25; display: none;
    min-height: 36px; padding: 6px 12px; font: inherit; font-size: 12px; color: var(--fg);
    background: rgba(13,17,22,.8); border: 1px solid var(--line); border-radius: var(--pill);
    cursor: pointer; touch-action: manipulation;
  }
  .stage:fullscreen #fsExit { display: block; }
  .stage:-webkit-full-screen #fsExit { display: block; }

  /* ---------- 下端のオーバーレイ(コメント / 操作 / 入力) ---------- */
  #cmWrap {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;
    padding: 0 calc(10px + env(safe-area-inset-right))
             calc(8px + var(--kb, 0px) + env(safe-area-inset-bottom))
             calc(10px + env(safe-area-inset-left));
    pointer-events: none;
    /* スクリムは帯全体に1枚だけ敷く。コメントの箱に背景を付けると、
       箱の輪郭が見えて「別のパネル」に見えてしまう(スクリムは映像に溶けさせる)。 */
    background: linear-gradient(to top,
      rgba(0,0,0,.92) 0%, rgba(0,0,0,.80) 12%, rgba(0,0,0,.55) 30%,
      rgba(0,0,0,.26) 48%, rgba(0,0,0,.08) 64%, rgba(0,0,0,0) 78%);
  }
  #cmWrap > * { pointer-events: auto; }

  /* コメントは下端から立ち上がるスクリムの上に流す(箱に見せない) */
  #comments {
    flex: 0 1 auto; min-height: 0; max-height: 44dvh; overflow: auto;
    padding: 6px 4px 2px; border: none; border-radius: 0; background: none;
    display: flex; flex-direction: column; gap: 5px;
    scrollbar-width: none;
  }
  #comments::-webkit-scrollbar { display: none; }
  .cm {
    font-size: 13.5px; line-height: 1.5; word-break: break-word; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  .cm .meta { color: #dbe4ec; margin-right: 6px; font-size: 11px; }
  .cm-host { color: #ffd479 !important; font-weight: 700; }
  /* コメントのアバター(画像 or 頭文字の丸) */
  .cm-av {
    width: 20px; height: 20px; border-radius: 50%; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #0d1116; overflow: hidden;
    vertical-align: -5px; border: none; padding: 0; cursor: default;
  }
  .cm-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cm .cm-av { margin-right: 6px; }

  /* 音量と全画面: 入力欄の上に細い帯として置く */
  #vrow {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
    padding: 7px 12px; border-radius: var(--pill);
    background: var(--panel); border: 1px solid var(--line);
  }
  #vrow .volgrp { display: flex; align-items: center; gap: 6px; flex: 1 1 120px; min-width: 0; }
  #vrow .vlabel { font-size: 11px; color: var(--fg2); flex: none; }
  #vrow input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
  #vrow #unmute {
    flex: none; padding: 6px 12px; min-height: 34px; font: inherit; font-size: 12px; color: var(--fg);
    background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: var(--pill);
    cursor: pointer; touch-action: manipulation; display: none;
  }
  #unmute.on { display: inline-block; }
  #vrow #fsBtn {
    flex: none; min-height: 34px; padding: 6px 12px; font: inherit; font-size: 12px;
    background: rgba(255,255,255,.08); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--pill); cursor: pointer; touch-action: manipulation; white-space: nowrap;
  }

  /* コメント入力(画面下端に浮かぶカプセル) */
  #cmForm {
    display: flex; align-items: center; gap: 6px;
    padding: 6px; border-radius: var(--pill);
    background: var(--panel); border: 1px solid var(--line);
  }
  #myAv { width: 36px; height: 36px; cursor: pointer; font-size: 15px; background: #8a93a0; }
  #cmColor {
    width: 32px; height: 32px; flex: none; padding: 2px;
    background: transparent; border: 1px solid var(--line); border-radius: 50%; cursor: pointer;
  }
  #cmName {
    width: 68px; flex: none; color: var(--fg); font: inherit; font-size: 16px;
    background: rgba(255,255,255,.08); border: none; border-radius: var(--pill); padding: 8px 10px;
    min-width: 0;
  }
  #cmText {
    flex: 1; min-width: 0; color: var(--fg); font: inherit; font-size: 16px;
    background: rgba(255,255,255,.10); border: none; border-radius: var(--pill); padding: 8px 12px;
  }
  #cmName::placeholder, #cmText::placeholder { color: rgba(233,238,243,.45); }
  #cmSend {
    flex: none; min-height: 36px; padding: 0 16px; font: inherit; font-size: 13px; font-weight: 700;
    background: var(--accent); color: #06240f; border: none; border-radius: var(--pill);
    cursor: pointer; touch-action: manipulation;
  }
  #cmSend:disabled, #cmText:disabled { opacity: .45; }
  /* P2Pが通らない回線の警告。既定は非表示で、検出したときだけ出す。 */
  #netWarn {
    flex: none; padding: 8px 12px; border-radius: 12px;
    font-size: 12.5px; color: #ffe2b8;
    background: rgba(80,48,4,.9); border: 1px solid rgba(255,170,60,.45);
  }

  /* 横画面・広い画面: コメントと入力欄は右側に寄せる(映像の邪魔をしない) */
  @media (orientation: landscape) and (min-width: 600px) {
    /* 横画面はコメントが右に寄るので、スクリムも右側だけに掛ける
       (全幅に掛けると映像の左下までも暗くなり、何を見ているか分かりにくい) */
    #cmWrap {
      align-items: flex-end; padding-right: calc(14px + env(safe-area-inset-right));
      background: linear-gradient(to left,
        rgba(0,0,0,.90) 0%, rgba(0,0,0,.62) 22%, rgba(0,0,0,.28) 36%, rgba(0,0,0,0) 52%);
    }
    #comments, #vrow, #cmForm { width: min(46vw, 440px); }
    #comments { max-height: 62dvh; }
  }

  /* ---------- ユーザー名ゲート ---------- */
  #nameGate {
    position: fixed; inset: 0; z-index: 100; background: rgba(6,9,12,.94);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .ng-box {
    width: 100%; max-width: 340px; background: #11151a; border: 1px solid #2a323b;
    border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .ng-title { font-size: 15px; font-weight: 700; color: #cfd6dd; text-align: center; }
  #ngName {
    background: #0d1116; border: 1px solid #2a323b; color: #e6e8ea;
    padding: 10px; border-radius: 10px; font: inherit; font-size: 16px;
  }
  #ngPass {
    background: #0d1116; border: 1px solid #2a323b; color: #e6e8ea;
    padding: 10px; border-radius: 10px; font: inherit; font-size: 16px;
  }
  #ngGo {
    padding: 12px; min-height: 44px; font: inherit; font-size: 14px; font-weight: 700;
    background: #1c3a2e; color: #dff3e8; border: 1px solid #2f5a46; border-radius: var(--pill);
    cursor: pointer; touch-action: manipulation;
  }
  .ng-icon-row { display: flex; align-items: center; gap: 10px; }
  .ng-icon-row button#ngIconBtn {
    flex: 1; min-height: 40px; padding: 8px; font: inherit; font-size: 13px;
    background: #161b21; color: #cfd6dd; border: 1px solid #2a323b; border-radius: 10px;
    cursor: pointer; touch-action: manipulation;
  }
  #ngIconPrev { width: 40px; height: 40px; font-size: 16px; background: #8a93a0; }

  /* 押した瞬間の反応。
     このファイルは * に -webkit-tap-highlight-color: transparent を掛けて
     OS標準のタップ反応を消しているため、これが無いとスマホで
     「押せたのかどうか」が全く分からない要素ができる(実際に
     全画面・再検索・アイコン選択などが無反応だった)。
     背景色はボタンごとに違うので、色を決め打ちせず明度で反応させる。 */
  button:active:not(:disabled) { filter: brightness(1.35); }
  /* キーボードのフォーカス位置を必ず見えるようにする(:focus ではなく :focus-visible)。 */
  :focus-visible { outline: 2px solid #36d399; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <h1>DESKTOP STREAM 視聴</h1>
  <!-- 版の表示。不具合報告のとき「どの版か」を利用者の画面だけで判別するために出す。 -->
  <span id="verClient" title="クライアントのバージョン">-</span>
  <span id="status" role="status" aria-live="polite">準備中…</span>
</header>

<!-- 視聴前のユーザー名入力ゲート: 名前を入れるまで視聴を開始しない -->
<div id="nameGate">
  <div class="ng-box">
    <div class="ng-title" id="ngTitle">ユーザー名を入力してください</div>
    <input id="ngName" type="text" maxlength="20" placeholder="名前" autocomplete="nickname" />
    <input id="ngPass" type="text" maxlength="20" placeholder="合言葉" style="display:none" />
    <div class="ng-icon-row">
      <button id="ngIconBtn" type="button">アイコンを選ぶ(任意)</button>
      <span id="ngIconPrev" class="cm-av"></span>
    </div>
    <input id="ngIconFile" type="file" accept="image/*" style="display:none" />
    <button id="ngGo">視聴をはじめる</button>
  </div>
</div>

<div id="app">
  <div class="stage">
    <video id="player" autoplay playsinline muted></video>
    <div id="ovMsg">配信を探しています…</div>
    <div id="soundOnly">♪ Sound Only</div>
    <div id="bTitle"></div>
    <button id="fsExit" aria-label="全画面を終了">✕ 全画面を終了</button>
    <button id="retry">↻ もう一度さがす</button>
  </div>
  <div id="cmWrap">
    <!-- P2Pが通らない回線を検出したときだけ出る。既定は非表示。 -->
    <div id="netWarn" style="display:none"></div>
    <div id="vrow">
      <span class="volgrp"><span class="vlabel">🎬動画</span><input id="volDesk" type="range" min="0" max="100" value="30" aria-label="動画音声の音量" /></span>
      <button id="unmute" aria-pressed="false">🔇 音声<span class="sw">OFF</span></button>
      <span class="volgrp"><span class="vlabel">🎙配信者マイク</span><input id="volMic" type="range" min="0" max="100" value="100" aria-label="配信者マイクの音量" /></span>
      <button id="fsBtn" aria-label="全画面表示">⛶ 全画面</button>
    </div>
    <div id="comments" aria-label="コメント一覧"></div>
    <div id="cmForm">
      <button id="myAv" type="button" class="cm-av" aria-label="アイコンを変更" title="アイコンを変更"></button>
      <input id="avFile" type="file" accept="image/*" style="display:none" />
      <input id="cmColor" type="color" title="コメントの色" aria-label="コメントの色" />
      <input id="cmName" type="text" placeholder="名前" maxlength="20" />
      <input id="cmText" type="text" placeholder="コメントを入力" maxlength="200" disabled />
      <button id="cmSend" disabled>送信</button>
    </div>
  </div>
</div>

<script>
"use strict";
const AYAME_URL = "wss://ayame-labo.shiguredo.app/signaling";
const $ = (id) => document.getElementById(id);
// ================= 表示言語(英語対応) =================
// 【ここに置く理由】読み込み時に通る処理が T() を呼ぶ。宣言より前に参照すると
// TDZ違反でスクリプト全体が止まる(過去に踏んだ地雷)。
// 【仕組み】辞書のキーは日本語の原文そのもの。日本語のときは何もしない。
// 辞書に無い文言は日本語のまま出るだけで、壊れはしない。
// 固定のマークアップは読み込み時に1回だけ完全一致で置き換え、JS で書く文言は T() を通す。
// 【ログは訳さない】log() は利用者から開発者へ送られる診断情報のため日本語のまま。
// 設計と、採らなかった案(書き込みの監視・data-i18n 属性)は docs/project/i18n-design.md。
// 【辞書は視聴クライアント専用】画面が別物なので操作クライアントとは共有しない。
// 仕組み(LANG / T / i18nApply)は操作クライアントと同じ。言語の選択欄は置かない
// (視聴者は共有されたURLから来るので、ブラウザの言語に従えば足りる。?lang= でも切り替えられる)。
const LANG = (() => {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "ja" || q === "en") return q;
    const s = localStorage.getItem("dss_lang");
    if (s === "ja" || s === "en") return s;
  } catch(e){}
  const n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
  if (!n) return "ja"; // 判定できなければ日本語
  return /^ja/i.test(n) ? "ja" : "en";
})();
// "@" で始まるキーは属性(title / placeholder / aria-label / alt)専用の訳。
// 同じ原文でも、狭いボタンの短い文言とツールチップでは別の訳が要るため。
const I18N_EN = {
  "DESKTOP STREAM 視聴": "DESKTOP STREAM Viewer",
  "Desktop Stream — 視聴": "Desktop Stream — Viewer",
  "準備中…": "Preparing…",
  "ユーザー名を入力してください": "Enter your name",
  "アイコンを選ぶ(任意)": "Choose an icon (optional)",
  "視聴をはじめる": "Start watching",
  "配信を探しています…": "Looking for the stream…",
  "✕ 全画面を終了": "✕ Exit fullscreen",
  "↻ もう一度さがす": "↻ Search again",
  "🎬動画": "🎬 Video",
  "🔇 音声": "🔇 Audio",
  "🔊 音声": "🔊 Audio",
  "🎙配信者マイク": "🎙 Streamer mic",
  "⛶ 全画面": "⛶ Fullscreen",
  "送信": "Send",
  "@クライアントのバージョン": "Client version",
  "@名前": "Name",
  "@合言葉": "Passphrase",
  "@全画面を終了": "Exit fullscreen",
  "@動画音声の音量": "Video audio volume",
  "@配信者マイクの音量": "Streamer mic volume",
  "@全画面表示": "Fullscreen",
  "@コメント一覧": "Comments",
  "@アイコンを変更": "Change icon",
  "@コメントの色": "Comment color",
  "@コメントを入力": "Write a comment",
  // ---- 状態と案内 ----
  "URLが不正です": "Invalid URL",
  "視聴用URLが正しくありません(roomパラメータを確認してください)": "The viewer URL is not valid (check the room parameter)",
  "さがしています… {0}/{1}": "Searching… {0}/{1}",

  "配信が見つかりません": "Stream not found",
  "配信が見つかりませんでした。配信中か、URLが正しいか確認してください。": "Could not find the stream. Check that it is live and that the URL is correct.",

  "Wi-Fiに切り替えるか、別の回線をお試しください。": "Try switching to Wi-Fi or another network.",
};
const I18N_HAS = (k) => Object.prototype.hasOwnProperty.call(I18N_EN, k);
// {0} を含むキーは、文字列を連結して作る文言と照合するための型。
// 取り出した値も辞書で訳す(「動作中 / 接続=未接続」の「未接続」など)。
const I18N_PAT = LANG !== "en" ? [] : Object.keys(I18N_EN).filter(k => /\{\d\}/.test(k)).map(k => {
  const idx = [];
  const src = k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
               .replace(/\\\{(\d)\\\}/g, (_, d) => { idx.push(+d); return "(.+?)"; });
  return [new RegExp("^" + src + "$"), k, idx];
});
// T("原文") / T("…{0}…", 値)。日本語では原文(と値の埋め込み)をそのまま返す。
function T(s, ...a){
  s = String(s);
  if (LANG === "en"){
    if (!a.length){
      const k = s.trim().replace(/\s+/g, " ");
      if (I18N_HAS(k)) return I18N_EN[k];
      for (const [re, key, idx] of I18N_PAT){
        const m = k.match(re);
        if (m){ idx.forEach((d, i) => { a[d] = T(m[i + 1]); }); s = I18N_EN[key]; break; }
      }
      if (!a.length) return s;
    } else if (I18N_HAS(s)) s = I18N_EN[s];
  }
  return a.length ? s.replace(/\{(\d)\}/g, (_, d) => (a[d] !== undefined ? a[d] : "")) : s;
}
// 要素の中の文字と属性を、辞書の完全一致で置き換える。
// 読み込み時に body 全体へ1回。innerHTML で組み立て直した要素にも使う
// (音声ボタンや録画ボタンは span 構造ごと書き直すため)。
// 照合は前後の空白を除き、内部の連続空白を1つにまとめてから行う。前後の空白は残す。
function i18nApply(root){
  if (LANG !== "en" || !root) return;
  const skip = (el) => el.closest("script,style,textarea,#log,[data-noi18n]");
  const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
  for (let n = w.currentNode; n; n = w.nextNode()){
    if (n.nodeType === 3){
      const p = n.parentElement;
      if (!p || skip(p)) continue;
      const v = n.nodeValue, k = v.trim().replace(/\s+/g, " ");
      if (!k || !I18N_HAS(k)) continue;
      n.nodeValue = v.match(/^\s*/)[0] + I18N_EN[k] + v.match(/\s*$/)[0];
    } else if (n.nodeType === 1 && !skip(n)){
      for (const at of ["title", "placeholder", "aria-label", "alt"]){
        const v = n.getAttribute(at);
        if (!v) continue;
        const k = v.trim().replace(/\s+/g, " ");
        if (I18N_HAS("@" + k)) n.setAttribute(at, I18N_EN["@" + k]);
        else if (I18N_HAS(k)) n.setAttribute(at, I18N_EN[k]);
      }
    }
  }
}
if (LANG === "en"){ document.documentElement.lang = "en"; document.title = T(document.title); i18nApply(document.body); }


// ================= バージョン表示 =================
// このクライアント自身の版。**リリースのたびに手で上げること**。
// GitHub Pages から配信されるため、配信元(exe)や操作クライアントとは
// 別々に古くなりうる。不具合報告を受けたとき、どれが古いのかを切り分けるために出す。
// 操作クライアント2種(web/index.html, ayame-client/client.html)の
// CLIENT_VERSION とは**別に管理する**(こちらは更新頻度が低く、揃える意味がない)。
const CLIENT_VERSION = "v0.7.16";
(function(){
  const o = $("verClient");
  if (o) o.textContent = CLIENT_VERSION;
})();
const video = $("player");

// ---- URLクエリから ベースID と 部屋数 を割り出す ----
// room = <ベース(32文字)> + <部屋数+1 の3桁>。例: 末尾011 → 部屋数10(001〜010を探す)
const roomParam = (new URLSearchParams(location.search).get("room") || "").trim();
let base = "", roomCount = 0;
if (roomParam.length > 3 && /^\d{3}$/.test(roomParam.slice(-3))) {
  base = roomParam.slice(0, -3);
  roomCount = parseInt(roomParam.slice(-3), 10) - 1;
}

let ws = null, pc = null, dc = null;
let joinedRoom = "";
let ended = false;

function pad3(n){ return String(n).padStart(3, "0"); }
// OSキーボードが出ている間、下端の入力欄が隠れないよう持ち上げる。
// interactive-widget=resizes-content を解釈しない環境(iOS Safari)では
// レイアウトが縮まず、キーボードが上に覆いかぶさる。実測して足すしかない。
(function(){
  const vv = window.visualViewport;
  if (!vv) return;
  const sync = () => {
    const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty("--kb", kb + "px");
  };
  vv.addEventListener("resize", sync);
  vv.addEventListener("scroll", sync);
  sync();
})();
function setStatus(text, cls){
  $("status").textContent = T(text);
  $("dot").className = cls || "";
}
function setOverlay(text){
  $("ovMsg").textContent = T(text || "");
  $("ovMsg").style.display = text ? "" : "none";
}
function enableComment(on){
  $("cmText").disabled = !on;
  $("cmSend").disabled = !on;
}

// ---- 入室スキャン: 001から順に試す ----
async function scan(){
  if (!base || roomCount < 1){
    setStatus("URLが不正です", "err");
    setOverlay("視聴用URLが正しくありません(roomパラメータを確認してください)");
    return;
  }
  ended = false;
  gotEnd = false;
  $("retry").classList.remove("on");
  let sawEmpty = false, sawFull = false;
  for (let i = 1; i <= roomCount; i++){
    setStatus(`さがしています… ${i}/${roomCount}`, "warn");
    setOverlay(`配信を探しています… (${i}/${roomCount})`);
    const res = await tryRoom(base + pad3(i));
    if (res === "joined"){ joinedRoom = base + pad3(i); return; }
    if (res === "empty") sawEmpty = true;
    if (res === "full") sawFull = true;
    // full=満員 / empty=配信側不在 → いずれも次の部屋を試す
  }
  if (sawFull && !sawEmpty){
    setStatus("満員です", "err");
    setOverlay("満員のため入室できませんでした。しばらくしてからお試しください。");
  } else {
    setStatus("配信が見つかりません", "err");
    setOverlay("配信が見つかりませんでした。配信中か、URLが正しいか確認してください。");
  }
  $("retry").classList.add("on");
}

// 1部屋を試す。joined: この部屋で接続開始(wsを引き継ぐ) / full / empty / error
function tryRoom(room){
  return new Promise((resolve) => {
    let done = false;
    const w = new WebSocket(AYAME_URL);
    const finish = (r, keepWs) => {
      if (done) return;
      done = true;
      clearTimeout(tm);
      if (!keepWs){ try { w.close(); } catch(e){} }
      resolve(r);
    };
    const tm = setTimeout(() => finish("error"), 5000);
    w.onopen = () => w.send(JSON.stringify({ type: "register", roomId: room, clientId: "dss-view-" + Date.now() }));
    w.onerror = () => finish("error");
    w.onclose = () => finish("error");
    w.onmessage = async (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
      if (m.type === "ping"){ w.send(JSON.stringify({ type: "pong" })); return; }
      if (m.type === "reject"){ finish("full"); return; }
      if (m.type === "accept"){
        if (!m.isExistClient){ finish("empty"); return; } // 配信側がこの部屋に居ない
        // 配信側が居る: この接続を本接続に昇格し、こちらからofferする
        ws = w;
        w.onclose = () => onEnded("接続が切れました");
        w.onerror = () => {};
        w.onmessage = onWsMessage;
        try { await startPeer(); finish("joined", true); }
        catch(e){ finish("error"); }
      }
    };
  });
}

async function onWsMessage(ev){
  let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
  try {
    if (m.type === "ping"){ ws.send(JSON.stringify({ type: "pong" })); return; }
    if (m.type === "answer"){ if (pc) await pc.setRemoteDescription({ type: "answer", sdp: m.sdp }); return; }
    if (m.type === "offer"){
      // 配信側からの再オファー(念のため対応)
      if (pc) { await pc.setRemoteDescription({ type: "offer", sdp: m.sdp });
        const ans = await pc.createAnswer();
        const asdp = tuneOpus(ans.sdp);
        await pc.setLocalDescription({ type: "answer", sdp: asdp });
        ws.send(JSON.stringify({ type: "answer", sdp: asdp })); }
      return;
    }
    if (m.type === "candidate" && m.ice){ if (pc){ try { await pc.addIceCandidate(m.ice); } catch(e){} } return; }
    if (m.type === "bye"){ onEnded("接続が切れました"); return; }
  } catch(e){}
}

// 受信するOpus音声の要求条件をSDPに追記する。
// fmtpは「受信側が何をどう送ってほしいか」の宣言なので、視聴側のSDPを
// 書き換えることで配信側エンコーダの動作(モノラル化・約32kbps・無音間引き)を避ける。
// 【音質ポリシー】このプロジェクトの音声はオリジナル音質のまま処理する。
// 音声は「配信者マイク」「PC音声」の2本のm-lineがあるため、
// 全てのOpusペイロードの全fmtp行(=全m-line)に適用すること。
// (以前は最初のfmtp行しか書き換えておらず、2本目がモノラル・低ビットレート・
//  DTX有効のままエンコードされて「こもった音」になる不具合があった)
function tuneOpus(sdp){
  const extra = "stereo=1;sprop-stereo=1;maxaveragebitrate=256000;usedtx=0";
  const pts = new Set();
  const rm = /a=rtpmap:(\d+) opus\/48000\/2/g;
  let m;
  while ((m = rm.exec(sdp))) pts.add(m[1]);
  for (const pt of pts){
    if (sdp.indexOf("a=fmtp:" + pt + " ") !== -1){
      // 既存のfmtp行(各m-lineに1行ずつある)全てに追記する
      const fre = new RegExp("a=fmtp:" + pt + " ([^\\r\\n]*)", "g");
      sdp = sdp.replace(fre, (mm, p) => "a=fmtp:" + pt + " " + p + ";" + extra);
    } else {
      // fmtp行が無い場合はrtpmap行(各m-lineに1行ずつある)の直後に挿入する
      const rre = new RegExp("(a=rtpmap:" + pt + " opus/48000/2)", "g");
      sdp = sdp.replace(rre, "$1\r\na=fmtp:" + pt + " " + extra);
    }
  }
  return sdp;
}


// ===== P2Pが通らない回線の検出 =====
// 2つの見方を併用する。片方だけでは足りないため。
//
//   ① 対称型NATの検出 … **原因そのもの**を測る。キャリアに依存しないので
//      楽天モバイル以外の同じ問題も拾える。ブラウザだけで完結する。
//   ② 回線事業者の照会(RDAP) … 既知の回線を名指しできる。①が出ない場合の
//      補強になる。JPNICの公開サービスを引くだけで、こちらでサーバーは持たない。
//
// 【なぜ逆引き(PTR)ではないのか】楽天モバイルのアドレスには**PTRレコードが無い**
// (実機で確認済み)。引けないものは判定に使えない。
//
// 【TURNを置かない理由】中継サーバーを持つと維持費がかかる。利用者の判断で、
// 「繋がるようにする」のではなく「繋がらないと分かるようにする」方針を採った。
const NAT_STUN = [
  "stun:stun.l.google.com:19302",
  // 2つ目は**別のIPを持つサーバー**であること。同じ相手では対称型NATを判定できない。
  "stun:stun1.l.google.com:19302",
];
let natSeen = new Map();  // 内側ポート -> 外から見えた外側ポートの集合
let natPublicIp = "";     // 自分のグローバルIP(srflx候補から取れる。取得に外部APIは不要)
let natWarned = false;

// ICE候補を1つ受け取るたびに呼ぶ。
function natNote(c){
  try {
    if (!c || c.type !== "srflx" || !c.address) return;
    natPublicIp = natPublicIp || c.address;
    // 【内側ポートで束ねられないことがある】relatedPort が 0 で返る実装があった(実測)。
    // その場合は「外から見えたアドレス」で束ねる。
    //   同じアドレスなのに外側ポートが複数 → 相手ごとに別の穴を開けている = 対称型NAT
    //   アドレスが違う → 別の回線(Wi-Fiと携帯など)。混ぜて判定しない
    const key = c.relatedPort ? ("p" + c.relatedPort) : ("a" + c.address);
    if (!natSeen.has(key)) natSeen.set(key, new Set());
    natSeen.get(key).add(c.port);
  } catch(e){}
}
// 同じ内側ポートに対して外側ポートが2種類以上見えたら対称型NAT。
// この形式では、中継(TURN)無しに直接つなぐ手段が無い。
function natIsSymmetric(){
  for (const ports of natSeen.values()) if (ports.size > 1) return true;
  return false;
}
// 候補収集が終わった時点で判定する。
async function natVerdict(){
  if (natWarned) return;
  let why = "";
  if (natIsSymmetric()) why = "この回線は直接つながらない形式(対称型NAT)です";
  else if (natPublicIp){
    const carrier = await natLookupCarrier(natPublicIp);
    if (carrier) why = carrier + " の回線です。直接つながらないことがあります";
  }
  if (!why) return;
  natWarned = true;
  natShowWarn(why);
}
// 回線事業者を調べる(RDAP)。
//
// 【エンドポイントを直接指定している理由】親の rdap.apnic.net はリダイレクトを挟み、
// その途中でCORSに阻まれる(実測)。JPNICのサーバーを直接引くと通る。
// 【引けなくてよい】日本以外のアドレスは404になる。その場合は何も言わない
// (誤った警告を出すよりは黙る)。
async function natLookupCarrier(ip){
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch("https://jpnic.rdap.apnic.net/ip/" + encodeURIComponent(ip),
                          { headers: { "Accept": "application/rdap+json" }, signal: ctl.signal });
    clearTimeout(t);
    if (!r.ok) return "";
    const text = await r.text();
    // 既知の「P2Pが通りにくい」回線。増やすときはここに足す。
    if (/rakuten/i.test(text)) return "楽天モバイル";
    return "";
  } catch(e){ return ""; }
}
const NAT_HINT = "Wi-Fiに切り替えるか、別の回線をお試しください。";
function natShowWarn(why){
  const el = document.getElementById("netWarn");
  if (el){ el.textContent = "⚠ " + T(why) + " " + T(NAT_HINT); el.style.display = ""; }
}

async function startPeer(){
  pc = new RTCPeerConnection({ iceServers: [{ urls: NAT_STUN }] });
  pc.onicecandidate = (e) => {
    if (!e.candidate) { natVerdict(); return; } // 候補収集の完了
    natNote(e.candidate);                        // P2Pが通らない回線かの判定材料
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "candidate", ice: e.candidate }));
  };
  pc.ontrack = (e) => {
    if (e.track.kind === "video"){
      // 映像だけをvideo要素へ。音声はWeb Audio側で個別に鳴らす(音量バランス用)。
      // Web Audio非対応環境では音声トラックが先にsrcObjectへ入ることがあるため保持する。
      const cur = video.srcObject;
      if (cur && cur.getVideoTracks && cur.getVideoTracks().length === 0){
        cur.addTrack(e.track);
      } else {
        video.srcObject = new MediaStream([e.track]);
      }
    } else {
      wireAudioTrack(e.transceiver ? e.transceiver.mid : null, e.track);
    }
    setOverlay("");
    $("unmute").classList.add("on");
    if (gateOpen()){
      // 先行入室中: 受信はするが再生はしない(名前入力後にngGoで再生を開始する)
      try { video.pause(); } catch(err){}
    } else {
      startSoundOnlyWatch();
    }
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "connected"){
      setStatus("視聴中", "ok");
      retryCount = 0; // 接続できたらリトライ回数を戻す
      acquireViewLock();
    }
    if (pc.connectionState === "failed" || pc.connectionState === "closed") onEnded("接続が切れました");
  };
  pc.addTransceiver("video", { direction: "recvonly" });
  // 音声は「配信者マイク」「PC音声(動画音声)」の2トラックを別々に受ける
  pc.addTransceiver("audio", { direction: "recvonly" });
  pc.addTransceiver("audio", { direction: "recvonly" });
  dc = pc.createDataChannel("comment");
  dc.onopen = () => {
    enableComment(true);
    // 名前・アイコン・合言葉を配信者へ通知する(合言葉が必要な配信では検証される)。
    // 名前入力ゲート表示中(先行入室)は名前を空+pendingで送り、入力後に type:"name" で更新する。
    const pending = gateOpen();
    const nm = pending ? "" :
      ($("cmName").value.trim() || localStorage.getItem("dss_view_name") || T("名無し")).slice(0, 20);
    try {
      dc.send(JSON.stringify({
        type: "hello",
        name: nm,
        pending,
        icon: myIcon(),
        pass: localStorage.getItem("dss_view_pass") || "",
      }));
    } catch(e){}
  };
  dc.onclose = () => enableComment(false);
  dc.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (m.type === "comment") addComment(m.name, m.text, m.ts, m.color, m.icon, m.host);
    if (m.type === "audiomap"){
      // 配信側からの「どのmidがマイク/PC音声か」の対応表
      audioMap = { mic: (m.mic != null ? String(m.mic) : null), desk: (m.desk != null ? String(m.desk) : null) };
      applyAudioGains();
    }
    if (m.type === "welcome"){
      // タイトル表示と、途中参加でも読めるようにコメント履歴を反映
      const t = String(m.title || "").slice(0, 40);
      $("bTitle").textContent = t;
      if (t) document.title = t + " - " + T("視聴中");
      if (Array.isArray(m.list)){
        $("comments").innerHTML = "";
        for (const c of m.list) addComment(c.name, c.text, c.ts, c.color, c.icon, c.host);
      }
    }
    if (m.type === "end"){
      gotEnd = true;
      onEnded("配信は終了しました", true);
    }
    if (m.type === "badpass"){
      gotEnd = true;
      onEnded("", true);
      showGate("この配信には合言葉が必要です", true);
    }
  };
  const offer = await pc.createOffer();
  const sdp = tuneOpus(offer.sdp);
  await pc.setLocalDescription({ type: "offer", sdp });
  ws.send(JSON.stringify({ type: "offer", sdp }));
}

// noRetry=true: 配信終了・合言葉不一致など、自動再接続すべきでない切断
// 受信映像がほぼ真っ黒(=配信側が静止画未選択などで無映像)なら "Sound Only" を表示する。
let soundOnlyTimer = null, soundCanvas = null;
function startSoundOnlyWatch(){
  if (soundOnlyTimer) return;
  soundCanvas = document.createElement("canvas");
  soundCanvas.width = 40; soundCanvas.height = 24;
  soundOnlyTimer = setInterval(() => {
    if (!video.videoWidth){ return; }
    try {
      const ctx = soundCanvas.getContext("2d");
      ctx.drawImage(video, 0, 0, 40, 24);
      const d = ctx.getImageData(0, 0, 40, 24).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += d[i] + d[i+1] + d[i+2];
      const avg = sum / (d.length / 4 * 3); // 0..255
      const dark = avg < 8;
      $("soundOnly").style.display = dark ? "" : "none";
    } catch(e){ /* CORS等で読めない場合は判定しない */ }
  }, 700);
}
function stopSoundOnlyWatch(){
  if (soundOnlyTimer){ clearInterval(soundOnlyTimer); soundOnlyTimer = null; }
  $("soundOnly").style.display = "none";
}

function onEnded(msg, noRetry){
  if (ended) return;
  ended = true;
  enableComment(false);
  releaseViewLock();
  try { pc && pc.close(); } catch(e){}
  try { ws && ws.close(); } catch(e){}
  pc = null; ws = null; dc = null;
  video.srcObject = null;
  clearAudioNodes();
  $("unmute").classList.remove("on");
  stopSoundOnlyWatch();
  if (noRetry || gotEnd){
    setStatus("終了", "err");
    if (msg) setOverlay(msg);
    $("retry").classList.add("on");
    return;
  }
  // 事故切断: 自動で再接続を試みる(間隔を広げながら最大8回)
  retryCount++;
  if (retryCount > 8){
    setStatus("切断", "err");
    setOverlay("再接続できませんでした");
    $("retry").classList.add("on");
    return;
  }
  const wait = Math.min(15000, 2000 * retryCount);
  setStatus(`再接続します… (${retryCount}回目)`, "warn");
  setOverlay(msg + "。自動で再接続します…");
  clearTimeout(retryTimer);
  retryTimer = setTimeout(scan, wait);
}
let gotEnd = false, retryCount = 0, retryTimer = null;

// 視聴中の画面スリープ防止
let viewLock = null;
async function acquireViewLock(){
  try { if ("wakeLock" in navigator) viewLock = await navigator.wakeLock.request("screen"); } catch(e){}
}
function releaseViewLock(){ try { if (viewLock) viewLock.release(); } catch(e){} viewLock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && pc && pc.connectionState === "connected") acquireViewLock();
});

// ---- コメント ----
$("cmName").value = localStorage.getItem("dss_view_name") || "";
// コメント色: 保存が無ければパレットからクライアントが自動選択する
const CM_PALETTE = ["#7fd1ff", "#ffd479", "#a5f3b4", "#ff9db0", "#d3b4ff", "#ffb47f", "#8ce8dc", "#f0ef8a"];
(function(){
  let c = localStorage.getItem("dss_view_color");
  if (!/^#[0-9a-fA-F]{6}$/.test(c || "")){
    c = CM_PALETTE[Math.floor(Math.random() * CM_PALETTE.length)];
    localStorage.setItem("dss_view_color", c);
  }
  $("cmColor").value = c;
})();
$("cmColor").addEventListener("change", () => localStorage.setItem("dss_view_color", $("cmColor").value));
// アイコンは**他人が送ってくるデータ**。<img> の src にそのまま入るため、
// 受け取る種類を絞る。
//
// 【SVGを外す理由】<img> で読み込んだSVGはスクリプトが動かない仕様なので、
// これ自体は今すぐの穴ではない。ただし「動かないはず」を前提に置き続けるより、
// ラスタ画像に限って**疑う余地そのものを消す**方が安い。
// 【data: に限る理由】http(s) を許すと、アイコンを置いた相手に
// 視聴者のIPアドレスが渡る(表示しただけで取得が走るため)。
function validIcon(v){
  v = String(v || "");
  if (v.length >= 20000) return "";
  return /^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(v) ? v : "";
}
function avatarEl(name, color, icon, host){
  const av = document.createElement("span");
  av.className = "cm-av";
  const ic = validIcon(icon);
  if (ic){
    const img = document.createElement("img");
    img.src = ic;
    av.appendChild(img);
  } else {
    av.style.background = host ? "#ffd479" : (/^#[0-9a-fA-F]{6}$/.test(color || "") ? color : "#8a93a0");
    av.textContent = (name || "?").slice(0, 1);
  }
  return av;
}
function addComment(name, text, ts, color, icon, host){
  name = String(name || T("名無し")).slice(0, 20);
  text = String(text || "").slice(0, 200);
  if (!text.trim()) return;
  const box = $("comments");
  const div = document.createElement("div");
  div.className = "cm";
  div.appendChild(avatarEl(name, color, icon, host));
  const meta = document.createElement("span");
  meta.className = "meta" + (host ? " cm-host" : "");
  meta.textContent = new Date(ts || Date.now()).toLocaleTimeString() + " " + name;
  const body = document.createElement("span");
  body.textContent = text; // textContentで挿入(HTMLとして解釈させない)
  if (!host && /^#[0-9a-fA-F]{6}$/.test(color || "")){ meta.style.color = color; body.style.color = color; }
  div.appendChild(meta); div.appendChild(body);
  // 先頭付近を見ているときだけ最新へ追従する。
  //
  // 以前は無条件に scrollTop = 0 へ戻していた。コメントは新しいものが上に入るため、
  // 過去のコメントを読もうとスクロールを下げている最中に誰かが発言すると、
  // そのたび先頭へ引き戻されて読めなくなる。視聴者が多いほど頻発する。
  // 判定は挿入の前に行う(挿入後はスクロール位置が動きうるため)。
  // 【並び順】新しいコメントを**下**に足す。映像の下端に重ねた帯では、上に足すと
  // 「新しい発言が上に出て、古いものが下へ流れ落ちる」動きになり、視聴画面として読みにくい。
  // 追従の判定は挿入の**前**に行う(挿入後はスクロール位置が動きうるため)。
  // 下端付近を見ているときだけ最新へ追従し、過去を読んでいる最中に引き戻さない
  // (上に足していた頃に「読んでいる最中に先頭へ引き戻される」不具合があり、その対策は残す)。
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.appendChild(div);
  while (box.childElementCount > 200) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}
function sendComment(){
  const text = $("cmText").value.trim();
  if (!text || !dc || dc.readyState !== "open") return;
  const name = $("cmName").value.trim().slice(0, 20) || T("名無し");
  localStorage.setItem("dss_view_name", name);
  // 自分のコメントも配信側から全員へ中継されて戻ってくるので、ここでは表示しない
  dc.send(JSON.stringify({ type: "comment", name, text, color: $("cmColor").value, icon: myIcon() }));
  $("cmText").value = "";
  // 連投防止: 送信後1.5秒は無効化(配信側でも同じ間隔で制限される)
  $("cmSend").disabled = true;
  setTimeout(() => { if (dc && dc.readyState === "open") $("cmSend").disabled = false; }, 1500);
}
$("cmSend").onclick = sendComment;
$("cmText").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) sendComment(); });

// ---- 音声再生: 受信した2本の音声トラック(マイク/PC音声)をWeb Audioで個別に鳴らす ----
// 【音質ポリシー】このプロジェクトの音声はオリジナル音質のまま処理する。
// 加工(フィルター・ノイズ抑制等)は追加しない。Web Audioはトラックごとの
// 音量(ゲイン)調整だけに使う。
// 音量バランスは「🎬動画(PC音声)」「🎙配信者マイク」の2本のスライダーで調整する。
// 既定はマイクの方が大きい(配信者マイク100% / 動画30%)。
let actx = null;                 // AudioContext(初回のトラック受信時に生成)
let audioMap = null;             // {mic, desk}: 配信側から届くmid対応表
const audioNodes = new Map();    // mid -> { track, gain, el }
let masterMuted = true;          // 自動再生制限のためミュートで開始

function volPref(key, defVal){
  const v = parseInt(localStorage.getItem(key), 10);
  return Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : defVal;
}
$("volDesk").value = volPref("dss_view_vol_desk", 30); // 既定: 動画30% / 配信者マイク100%(マイクを大きく)
$("volMic").value  = volPref("dss_view_vol_mic", 100);

function ensureAudioCtx(){
  if (actx) return actx;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; }
  return actx;
}
// 受信音声トラックをWeb Audioへ接続する。midごとにゲインノードを持つ。
function wireAudioTrack(mid, track){
  mid = (mid != null) ? String(mid) : ("t" + audioNodes.size);
  if (audioNodes.has(mid)) return;
  const ctx = ensureAudioCtx();
  const st = new MediaStream([track]);
  // Safari対策: リモート音声トラックはメディア要素に接続しないと
  // Web Audioへサンプルが流れないことがあるため、ミュートした<audio>を噛ませる
  const el = document.createElement("audio");
  el.muted = true; el.autoplay = true;
  el.srcObject = st;
  el.play && el.play().catch(() => {});
  if (!ctx){
    // Web Audioが使えない環境: video要素に音声も入れて従来通り鳴らす(バランス調整不可)
    try {
      const ms = video.srcObject || new MediaStream();
      ms.addTrack(track);
      video.srcObject = ms;
    } catch(e){}
    return;
  }
  try {
    const src = ctx.createMediaStreamSource(st);
    const gain = ctx.createGain();
    src.connect(gain).connect(ctx.destination);
    audioNodes.set(mid, { track, gain, el });
    applyAudioGains();
  } catch(e){}
}
// スライダー値・ミュート状態・mid対応表から各トラックのゲインを決める
function applyAudioGains(){
  const vd = $("volDesk").value / 100;
  const vm = $("volMic").value / 100;
  for (const [mid, n] of audioNodes){
    let v;
    if (audioMap && audioMap.mic === mid) v = vm;
    else if (audioMap && audioMap.desk === mid) v = vd;
    else v = vd; // 対応表が未着/旧配信(ミックス済1本)は動画スライダーで調整
    n.gain.gain.value = masterMuted ? 0 : v;
  }
}
function clearAudioNodes(){
  for (const [, n] of audioNodes){
    try { n.gain.disconnect(); } catch(e){}
    try { n.el.srcObject = null; } catch(e){}
  }
  audioNodes.clear();
  audioMap = null;
}
$("volDesk").addEventListener("input", () => { localStorage.setItem("dss_view_vol_desk", $("volDesk").value); applyAudioGains(); });
$("volMic").addEventListener("input", () => { localStorage.setItem("dss_view_vol_mic", $("volMic").value); applyAudioGains(); });

// ---- 音声ON(自動再生制限のためミュートで開始) ----
$("unmute").onclick = () => {
  masterMuted = !masterMuted;
  if (!masterMuted){
    if (actx && actx.state === "suspended") actx.resume().catch(() => {});
    video.play().catch(() => {});
    // Web Audio非対応フォールバック時はvideo側のミュートも解除する
    video.muted = audioNodes.size > 0;
  } else {
    video.muted = true;
  }
  applyAudioGains();
  setViewMuteLabel();
};
// 表示は「押すとどうなるか」ではなく**いまどうなっているか**で統一する。
// 操作クライアント2種と同じ直し方(絵柄が状態、文言が動作を指していて逆を向いていた)。
function setViewMuteLabel(){
  const on = !masterMuted;
  const b = $("unmute");
  b.innerHTML = (on ? "🔊" : "🔇") + ' 音声<span class="sw' + (on ? " on" : "") + '">' +
                (on ? "ON" : "OFF") + '</span>';
  b.setAttribute("aria-pressed", on ? "true" : "false");
  i18nApply(b);
}
$("retry").onclick = () => { $("retry").classList.remove("on"); retryCount = 0; scan(); };

// ---- 全画面 ----
function exitFs(){
  if (document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}
$("fsBtn").onclick = () => {
  const st = document.querySelector(".stage");
  if (document.fullscreenElement || document.webkitFullscreenElement){
    exitFs();
  } else {
    (st.requestFullscreen || st.webkitRequestFullscreen).call(st);
  }
};
$("fsExit").onclick = (e) => { e.stopPropagation(); exitFs(); };

// ---- タイトル表示のトグル: プレーヤーをタップすると表示/非表示 ----
(function(){
  const st = document.querySelector(".stage");
  st.addEventListener("click", (e) => {
    // ボタン類のタップではトグルしない
    if (e.target.closest("button")) return;
    st.classList.toggle("hide-title");
  });
})();

// ---- アイコン(画像を48pxに縮小してdataURL保存) ----
function myIcon(){ return validIcon(localStorage.getItem("dss_view_icon") || ""); }
function setIconPreview(){
  for (const id of ["myAv", "ngIconPrev"]){
    const el = $(id);
    if (!el) continue;
    el.innerHTML = "";
    const ic = myIcon();
    if (ic){
      const img = document.createElement("img");
      img.src = ic;
      el.appendChild(img);
      el.style.background = "";
    } else {
      const nm = ($("cmName").value || localStorage.getItem("dss_view_name") || "?").trim();
      el.textContent = nm.slice(0, 1) || "?";
      el.style.background = $("cmColor") ? $("cmColor").value : "#8a93a0";
    }
  }
}
function loadIconFile(file){
  if (!file || !file.type.startsWith("image/")) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = 48; c.height = 48;
    const ctx = c.getContext("2d");
    // 中央を正方形に切り出して縮小
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 48, 48);
    let url = c.toDataURL("image/jpeg", 0.8);
    if (url.length >= 20000) url = c.toDataURL("image/jpeg", 0.5);
    if (url.length < 20000){
      localStorage.setItem("dss_view_icon", url);
      setIconPreview();
    }
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
}
$("myAv").onclick = () => $("avFile").click();
$("avFile").addEventListener("change", (e) => { loadIconFile(e.target.files && e.target.files[0]); e.target.value = ""; });
$("ngIconBtn").onclick = () => $("ngIconFile").click();
$("ngIconFile").addEventListener("change", (e) => { loadIconFile(e.target.files && e.target.files[0]); e.target.value = ""; });
$("cmColor").addEventListener("change", setIconPreview);
setIconPreview();

// ---- ゲート表示(名前入力 / 合言葉要求時の再表示) ----
// ゲート表示中でも入室(Ayame接続)は先に試みる。映像は受信するが再生はしない。
function gateOpen(){ return $("nameGate").style.display !== "none"; }
function showGate(title, needPass){
  $("ngTitle").textContent = T(title || "ユーザー名を入力してください");
  $("ngPass").style.display = needPass ? "" : "none";
  $("ngName").value = localStorage.getItem("dss_view_name") || "";
  $("ngPass").value = localStorage.getItem("dss_view_pass") || "";
  $("nameGate").style.display = "";
  (needPass ? $("ngPass") : $("ngName")).focus();
}

// 名前が保存済みならすぐ視聴開始。未入力ならゲートで入力を求める。
// 合言葉不一致で戻された場合は showGate(…, true) で合言葉欄つきで再表示される。
$("ngGo").onclick = () => {
  const n = $("ngName").value.trim().slice(0, 20);
  if (!n){ $("ngName").focus(); return; }
  localStorage.setItem("dss_view_name", n);
  if ($("ngPass").style.display !== "none"){
    localStorage.setItem("dss_view_pass", $("ngPass").value.trim().slice(0, 20));
  }
  $("cmName").value = n;
  $("nameGate").style.display = "none";
  setIconPreview();
  if (pc && dc && dc.readyState === "open"){
    // 先行入室が成功済み: 再スキャンせず、名前を配信側へ通知して再生を開始する
    try {
      dc.send(JSON.stringify({ type: "name", name: n, icon: myIcon(),
                               pass: localStorage.getItem("dss_view_pass") || "" }));
    } catch(e){}
    video.play().catch(() => {});
    startSoundOnlyWatch();
    return;
  }
  // まだ入室できていない(満員・不在・合言葉不一致で切断など): 再チャレンジ
  gotEnd = false; retryCount = 0;
  scan();
};
$("ngName").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) $("ngGo").click(); });
$("ngPass").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) $("ngGo").click(); });
(function(){
  const saved = (localStorage.getItem("dss_view_name") || "").trim();
  if (saved){
    $("nameGate").style.display = "none";
    scan();
  } else {
    // 名前未入力でも先に入室だけ試みて席を確保する(映像は再生しない)。
    // 配信側には「ユーザー名未入力」として通知され、名前入力後に更新される。
    showGate("", false);
    scan();
  }
})();
</script>
